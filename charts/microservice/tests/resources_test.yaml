suite: optional resources
release:
  name: orders
  namespace: shop
set:
  image.repository: registry.example.com/orders
  image.tag: v1.0.0
tests:
  - it: renders the HTTPRoute towards the Service port
    template: templates/httproute.yaml
    set:
      service.port: 8081
      httpRoute.enabled: true
      httpRoute.parentRefs:
        - name: gateway
          namespace: istio-system
      httpRoute.hostnames: [orders.example.com]
    asserts:
      - equal:
          path: spec.rules[0].backendRefs
          value:
            - name: orders
              port: 8081
      - equal:
          path: spec.hostnames
          value: [orders.example.com]

  - it: requires parentRefs on the HTTPRoute
    template: templates/httproute.yaml
    set:
      httpRoute.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: httpRoute.parentRefs is required

  - it: renders the ServiceMonitor with the configured path
    template: templates/servicemonitor.yaml
    set:
      serviceMonitor.enabled: true
      serviceMonitor.path: /internal/metrics
    asserts:
      - equal:
          path: spec.endpoints[0].path
          value: /internal/metrics
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [shop]

  - it: renders no optional resources by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/hpa.yaml
      - hasDocuments:
          count: 0
        template: templates/pdb.yaml
      - hasDocuments:
          count: 0
        template: templates/servicemonitor.yaml
      - hasDocuments:
          count: 0
        template: templates/httproute.yaml
      - hasDocuments:
          count: 0
        template: templates/extra-objects.yaml

  - it: renders extraObjects from maps and strings through tpl
    template: templates/extra-objects.yaml
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: '{{ include "microservice.fullname" . }}-a'
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ .Release.Name }}-b
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: orders-a
        documentIndex: 0
      - equal:
          path: metadata.name
          value: orders-b
        documentIndex: 1
